# =============================================================================
#
# leaps — Zensical configuration
#
# This file configures the published learning book that is built with
# Zensical (https://zensical.org) and deployed to GitHub Pages on every push
# to `main` (see .github/workflows/docs.yml).
#
# The book is intentionally minimal: it exposes ONLY the index of courses
# (TOPICS/README.md) and the courses themselves (each topic and its modules).
# Repository tooling — AGENTS.md, PROMPTS/, SCRIPTS/, TEMPLATES/, docs/, etc.
# — is deliberately excluded by pointing `docs_dir` at TOPICS/.
#
# Navigation is IMPLICIT: it is derived automatically from the TOPICS/
# directory tree, so every new topic or module appears in the book with no
# configuration changes. Each directory's README.md becomes that section's
# index page.
#
# =============================================================================

[project]

# The site_name is shown in the page header and the browser window title.
site_name = "leaps"

# A meaningful description for search engines and social previews.
site_description = "leaps — a structured, AI-native learning book. An index of courses and the courses themselves."

site_author = "leaps contributors"

# The canonical URL for the published GitHub Pages site.
site_url = "https://curiousfurbytes.github.io/leaps/"

# Build the book from the learning material only. TOPICS/ contains the course
# index (TOPICS/README.md) and every course (topic + modules).
docs_dir = "TOPICS"

# The repository the "edit" / "view source" buttons link to.
repo_url = "https://github.com/CuriousFurBytes/leaps"
repo_name = "CuriousFurBytes/leaps"
edit_uri = "edit/main/TOPICS/"

copyright = """
Content licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
"""

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/CuriousFurBytes/leaps"

# ----------------------------------------------------------------------------
# Markdown extensions
#
# These mirror Zensical's recommended defaults and cover the syntax used
# throughout the courses: admonitions/callouts, Mermaid diagrams, code
# annotations, content tabs, task lists, footnotes, and math.
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
