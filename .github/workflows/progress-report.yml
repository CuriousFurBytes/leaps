name: "Generate Progress Report"

on:
  push:
    branches:
      - main
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  generate-report:
    name: "Generate Progress Report"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so the report can include commit-level stats
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install report dependencies
        run: |
          pip install --quiet --upgrade pip
          if [ -f SCRIPTS/requirements-report.txt ]; then
            pip install -r SCRIPTS/requirements-report.txt
          fi

      - name: Generate JSON report
        run: python SCRIPTS/progress_report.py --json > progress_report.json

      - name: Generate Markdown report
        run: python SCRIPTS/progress_report.py > progress_report.md

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: progress-report-${{ github.run_number }}
          path: |
            progress_report.json
            progress_report.md
          retention-days: 90

      - name: Commit report to repository
        # Only commit on push to main or scheduled runs, not on workflow_dispatch
        # to avoid noisy commits during manual testing.
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add progress_report.md progress_report.json
          if git diff --cached --quiet; then
            echo "No changes to report — skipping commit."
          else
            git commit -m "chore: update progress report [skip ci]"
            git push
          fi
