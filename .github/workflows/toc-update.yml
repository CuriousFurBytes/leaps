name: "Auto-generate Table of Contents"

on:
  push:
    branches:
      - main
    paths:
      - "**.md"

jobs:
  update-toc:
    name: "Update TOC for Changed Markdown Files"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a PAT or the default GITHUB_TOKEN. A PAT is required if you
          # want the resulting commit to trigger subsequent workflows.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Get list of changed markdown files
        id: changed_files
        run: |
          # Compare HEAD against the previous commit to find changed .md files.
          # Exclude auto-generated files and the progress report to avoid loops.
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.md' \
            | grep -v '^progress_report\.md$' \
            | tr '\n' ' ')
          echo "files=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Changed markdown files: ${CHANGED}"

      - name: Generate TOC for changed files
        if: steps.changed_files.outputs.files != ''
        run: |
          for file in ${{ steps.changed_files.outputs.files }}; do
            if [ -f "$file" ]; then
              echo "Generating TOC for: $file"
              python SCRIPTS/generate_toc.py "$file"
            else
              echo "Skipping deleted file: $file"
            fi
          done

      - name: Commit updated TOCs
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No TOC changes detected — skipping commit."
          else
            git commit -m "chore: auto-update table of contents [skip ci]"
            git push
          fi
