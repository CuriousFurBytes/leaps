# Builds the leaps learning book with Zensical and deploys it to GitHub Pages.
#
# Runs automatically on every push to `main` (i.e. when a PR is merged) and
# can also be triggered manually from the Actions tab.
#
# One-time setup: in the repository settings, set
#   Settings → Pages → Build and deployment → Source → "GitHub Actions".
name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment; cancel in-progress runs for new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
