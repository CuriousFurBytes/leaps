name: "Validate Repository Structure"

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate-markdown:
    name: "Lint Markdown Files"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: ".github/markdownlint.json"
          globs: "**/*.md"

  validate-structure:
    name: "Validate Repository Structure"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run structure validation
        run: python SCRIPTS/validate_structure.py
        continue-on-error: true

  validate-notebooks:
    name: "Validate Jupyter Notebooks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install notebook validation dependencies
        run: pip install nbformat

      - name: Validate notebooks
        run: python SCRIPTS/validate_notebooks.py

  check-broken-links:
    name: "Check for Broken Internal Links"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Find broken links
        run: python SCRIPTS/find_broken_links.py
        continue-on-error: true
