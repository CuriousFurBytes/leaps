version: '3.8'

services:
  leaps:
    build: .
    container_name: leaps
    volumes:
      # Mount the entire leaps repo into /workspace
      - ../../:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Default starts an interactive shell. Override with a command as needed, e.g.:
    # command: python3 script.py
