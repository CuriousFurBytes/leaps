version: '3.8'

services:
  leaps:
    build: .
    container_name: leaps-jupyter
    ports:
      - "8888:8888"
    volumes:
      # Mount the entire leaps repo into /workspace
      - ../../:/workspace
    environment:
      - JUPYTER_ENABLE_LAB=yes
    restart: unless-stopped
    # Uncomment to set a token for Jupyter (recommended for shared or remote machines)
    # command: >
    #   jupyter lab
    #     --ip=0.0.0.0
    #     --port=8888
    #     --no-browser
    #     --allow-root
    #     --NotebookApp.token='your-token-here'
